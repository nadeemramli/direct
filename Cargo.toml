[workspace]
resolver = "2"
members = ["crates/direct-core", "crates/direct", "app/src-tauri"]
default-members = ["crates/direct-core", "crates/direct"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
direct-core = { path = "crates/direct-core" }
direct = { path = "crates/direct" }
