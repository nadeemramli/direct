name: Foundation checks
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: node --test scripts/guidance-view.test.mjs
      - run: cargo fmt --all --check
      - run: cargo test -p direct-core -p direct --locked
      - run: cargo test -p direct-mcp --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build -p direct -p direct-desktop --features direct-desktop/custom-protocol --locked
